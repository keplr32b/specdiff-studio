<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpecDiff Studio</title>
  <style>
    :root {
      --bg: #0b0f14; --panel: #121820; --line: #1e2a38;
      --text: #e8eef6; --muted: #8b9bb0; --accent: #5b8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #152238 0%, var(--bg) 55%);
      color: var(--text); line-height: 1.5; min-height: 100vh;
    }
    a { color: var(--accent); }
    .wrap { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    h1 { margin: 0; font-size: 1.4rem; }
    .tag { color: var(--muted); margin: 0.25rem 0 1rem; font-size: 0.95rem; }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: 1rem;
    }
    h2 { margin: 0 0 0.85rem; font-size: 1rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.65rem; }
    input {
      display: block; width: 100%; margin-top: 0.3rem; padding: 0.5rem 0.65rem;
      border-radius: 10px; border: 1px solid var(--line); background: #0a1018;
      color: var(--text); font-size: 0.85rem;
    }
    button {
      appearance: none; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.55rem 0.9rem; font-weight: 600; font-size: 0.9rem;
      background: linear-gradient(135deg, #3d6ef5, #5b8cff); color: #fff;
      margin: 0.25rem 0.4rem 0.25rem 0;
    }
    button.secondary { background: #1a2433; border: 1px solid var(--line); }
    .muted { color: var(--muted); font-size: 0.88rem; }
    #walletStatus { display: inline-block; margin-left: 0.4rem; font-size: 0.8rem; word-break: break-all; }
    #out {
      margin-top: 0.85rem; padding: 0.75rem; border-radius: 10px;
      border: 1px solid var(--line); background: #0a1018; font-size: 0.78rem;
      white-space: pre-wrap; word-break: break-word; min-height: 4rem; max-height: 280px; overflow: auto;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>SpecDiff Studio</h1>
      <p class="tag">Spec vs impl — GenLayer consensus (browser app)</p>
      <button type="button" id="btnConnect">Connect wallet</button>
      <span id="walletStatus" class="muted">Not connected</span>
    </header>

    <section class="card">
      <h2>Create check</h2>
      <label>check_id <input id="checkId" value="ui-demo-mobile-1" /></label>
      <label>spec_url <input id="specUrl" value="https://docs.genlayer.com" /></label>
      <label>impl_url <input id="implUrl" value="https://docs.genlayer.com" /></label>
      <label>title <input id="title" value="UI mobile demo" /></label>
      <button type="button" id="btnCreate">create_check</button>
    </section>

    <section class="card">
      <h2>Run / read</h2>
      <label>check_id <input id="runId" value="ui-demo-mobile-1" /></label>
      <button type="button" id="btnRun">run_check</button>
      <button type="button" id="btnLast" class="secondary">get_last</button>
      <pre id="out">Ready. Connect wallet (MetaMask mobile / browser).</pre>
    </section>

    <p class="muted">
      Contract
      <a href="https://explorer-studio.genlayer.com/address/0x7A728FDBA822bA16adDc9eD3138980FF89b9868C" target="_blank" rel="noopener">0x7A728F…868C</a>
      · Hosts must be owner-allowlisted. Studio network in wallet required.
    </p>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/genlayer-js";
    import { studionet } from "https://esm.sh/genlayer-js/chains";
    import { TransactionStatus } from "https://esm.sh/genlayer-js/types";

    const CONTRACT = "0x7A728FDBA822bA16adDc9eD3138980FF89b9868C";
    const out = document.getElementById("out");
    const walletStatus = document.getElementById("walletStatus");
    let address = null;
    let client = null;

    function log(msg) {
      out.textContent = typeof msg === "string" ? msg : JSON.stringify(msg, null, 2);
    }

    async function connect() {
      if (!window.ethereum) {
        log("No wallet. Open in MetaMask in-app browser or a wallet browser.");
        return;
      }
      const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
      address = accounts[0];
      walletStatus.textContent = address;
      client = createClient({
        chain: studionet,
        account: address,
        provider: window.ethereum,
      });
      try { await client.connect("studionet"); } catch (e) {
        log("connect warning: " + (e && e.message ? e.message : e));
      }
      try {
        if (client.initializeConsensusSmartContract) {
          await client.initializeConsensusSmartContract();
        }
      } catch (_) {}
      log("Connected. You can create_check / run_check.");
    }

    async function write(functionName, args) {
      if (!client) throw new Error("Connect wallet first");
      const payload = { address: CONTRACT, functionName, args, value: 0n };
      let txHash;
      try {
        const estimate = await client.estimateTransactionFeesForWrite(payload);
        txHash = await client.writeContract({
          ...payload,
          fees: {
            distribution: estimate.distribution,
            feeValue: estimate.feeValue,
            messageAllocations: estimate.messageAllocations,
          },
        });
      } catch {
        txHash = await client.writeContract(payload);
      }
      log("Tx: " + txHash + "\nWaiting (run_check may take 1–3 min)...");
      try {
        await client.waitForTransactionReceipt({
          hash: txHash,
          status: TransactionStatus.ACCEPTED,
          retries: 120,
          interval: 5000,
        });
      } catch (e) {
        log("Tx " + txHash + " — " + (e && e.message ? e.message : e));
      }
      return txHash;
    }

    async function read(functionName, args) {
      const readClient = createClient({ chain: studionet });
      return readClient.readContract({ address: CONTRACT, functionName, args });
    }

    document.getElementById("btnConnect").onclick = () =>
      connect().catch((e) => log(e.message || String(e)));

    document.getElementById("btnCreate").onclick = async () => {
      try {
        const hash = await write("create_check", [
          document.getElementById("checkId").value.trim(),
          document.getElementById("specUrl").value.trim(),
          document.getElementById("implUrl").value.trim(),
          document.getElementById("title").value.trim(),
        ]);
        log("create_check done\n" + hash);
      } catch (e) {
        log("create_check: " + (e.message || e));
      }
    };

    document.getElementById("btnRun").onclick = async () => {
      try {
        const id = document.getElementById("runId").value.trim();
        const hash = await write("run_check", [id]);
        const last = await read("get_last", [id]);
        log({ tx: hash, get_last: last });
      } catch (e) {
        log("run_check: " + (e.message || e));
      }
    };

    document.getElementById("btnLast").onclick = async () => {
      try {
        const id = document.getElementById("runId").value.trim();
        log(await read("get_last", [id]));
      } catch (e) {
        log("get_last: " + (e.message || e));
      }
    };
  </script>
</body>
</html>
