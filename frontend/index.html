<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpecDiff Studio</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>SpecDiff Studio</h1>
      <p class="tag">Spec vs impl — GenLayer consensus</p>
      <button id="btnConnect" type="button">Connect wallet</button>
      <span id="walletStatus" class="muted">Not connected</span>
    </header>

    <section class="card">
      <h2>Create check</h2>
      <label>check_id <input id="checkId" value="ui-demo-1" /></label>
      <label>spec_url <input id="specUrl" value="https://docs.genlayer.com" /></label>
      <label>impl_url <input id="implUrl" value="https://docs.genlayer.com" /></label>
      <label>title <input id="title" value="UI demo pair" /></label>
      <button id="btnCreate" type="button">create_check</button>
    </section>

    <section class="card">
      <h2>Run / read</h2>
      <label>check_id <input id="runId" value="ui-demo-1" /></label>
      <button id="btnRun" type="button">run_check</button>
      <button id="btnLast" type="button">get_last</button>
      <pre id="out" class="out">Ready.</pre>
    </section>

    <p class="muted">
      Contract
      <a href="https://explorer-studio.genlayer.com/address/0x7A728FDBA822bA16adDc9eD3138980FF89b9868C" target="_blank" rel="noopener">
        0x7A728FDBA822bA16adDc9eD3138980FF89b9868C
      </a>
      · Hosts must already be allowlisted by owner.
    </p>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
